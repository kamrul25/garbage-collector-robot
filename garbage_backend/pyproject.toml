[project]
name = "garbage-backend"
version = "0.1.0"
description = "AI-driven garbage collector: YOLO inference + decision state machine + command dispatch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "ultralytics>=8.2",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]


[tool.uv.build-backend]
module-name = "backend"          # my actual package folder name   

[project.scripts]
backend = "backend.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
